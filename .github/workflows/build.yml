name: Build

on:
  push:
    branches: [main, claude/cashflow-data-balance-engine-sfgw0m]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and debug APK
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace

      - name: Print test summary and Room schema
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for f in sorted(glob.glob("app/build/test-results/testDebugUnitTest/*.xml")):
              r = ET.parse(f).getroot()
              print("SUITE", r.get("name"), "tests=%s failures=%s errors=%s skipped=%s" % (r.get("tests"), r.get("failures"), r.get("errors"), r.get("skipped")))
              for c in r.findall("testcase"):
                  bad = c.find("failure") is not None or c.find("error") is not None
                  print("  ", "FAIL" if bad else "pass", c.get("name"))
          PY
          for f in app/schemas/*/*.json; do echo "=== $f"; cat "$f"; done || true

      - name: Commit generated Room schemas (temporary)
        if: github.ref != 'refs/heads/main'
        run: |
          if [ -n "$(git status --porcelain app/schemas)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/schemas
            git commit -m "Add generated Room schema"
            git push
          fi

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/test-results/testDebugUnitTest/*.xml

      - name: Upload Room schemas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: app/schemas/
          if-no-files-found: ignore

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cashflow-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish pre-release asset
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk cashflow-debug.apk
          gh release view latest-debug >/dev/null 2>&1 || \
            gh release create latest-debug --prerelease --target "$GITHUB_SHA" \
              --title "Latest debug build" --notes "Automated debug build from main."
          gh release upload latest-debug cashflow-debug.apk --clobber
