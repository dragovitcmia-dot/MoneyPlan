name: Build

on:
  push:
    branches: [main, claude/cashflow-data-balance-engine-sfgw0m]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and debug APK
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/test-results/testDebugUnitTest/*.xml

      - name: Upload Room schemas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: app/schemas/
          if-no-files-found: ignore

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cashflow-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish pre-release asset
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk cashflow-debug.apk
          gh release view latest-debug >/dev/null 2>&1 || \
            gh release create latest-debug --prerelease --target "$GITHUB_SHA" \
              --title "Latest debug build" --notes "Automated debug build from main."
          gh release upload latest-debug cashflow-debug.apk --clobber
