name: Build

on:
  push:
    branches: [main, claude/cashflow-data-balance-engine-sfgw0m]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and debug APK
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest assemblePreview --stacktrace 2>&1 | tee gradle.log

      - name: Merged manifest backup attributes
        if: always()
        run: |
          M=$(find app/build/intermediates -path '*merged_manifests*' -name AndroidManifest.xml | head -1)
          echo "merged manifest: $M"
          echo "::notice title=Merged manifest::$(grep -o 'android:allowBackup="[a-z]*"\|android:fullBackupContent="[^"]*"\|android:dataExtractionRules="[^"]*"\|android:name="com.cashflow.app.RestartActivity"\|android:process=":restart"' "$M" | tr '\n' ' ')"
          for f in app/src/main/res/xml/backup_rules.xml app/src/main/res/xml/data_extraction_rules.xml; do echo "--- $f"; cat "$f"; done

      - name: Show the exported Room schemas
        if: always()
        run: |
          for f in app/schemas/*/*.json; do
            echo "::notice title=Room schema $f::$(tr -d '\n' < "$f" | sed 's/%/%25/g')"
          done

      - name: Gradle failure summary
        if: failure()
        run: |
          python3 - <<'PY'
          import re
          t = open("gradle.log", errors="replace").read()
          out = []
          m = re.search(r"\* What went wrong:\n(.*?)\n\* Try:", t, re.S)
          if m:
              out.append(m.group(1).strip())
          out += [l for l in t.splitlines() if l.startswith("e: ") or " error: " in l][:30]
          msg = "\n".join(out)[:3500].replace("%", "%25").replace("\r", "").replace("\n", "%0A")
          print("::error title=Gradle failure::" + msg)
          PY

      - name: Print test summary
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          total = 0
          for f in sorted(glob.glob("app/build/test-results/testDebugUnitTest/*.xml")):
              r = ET.parse(f).getroot()
              total += int(r.get("tests"))
              print("SUITE", r.get("name"), "tests=%s failures=%s errors=%s skipped=%s" % (r.get("tests"), r.get("failures"), r.get("errors"), r.get("skipped")))
              for c in r.findall("testcase"):
                  if c.find("failure") is not None or c.find("error") is not None:
                      print("  FAIL", c.get("name"))
          print("TOTAL", total)
          PY

      - name: Test summary annotation
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          lines, total, bad = [], 0, 0
          for f in sorted(glob.glob("app/build/test-results/testDebugUnitTest/*.xml")):
              r = ET.parse(f).getroot()
              n, fl = int(r.get("tests")), int(r.get("failures")) + int(r.get("errors"))
              total += n; bad += fl
              lines.append("%s tests=%d failed=%d" % (r.get("name").split(".")[-1], n, fl))
          lines.append("TOTAL tests=%d failed=%d" % (total, bad))
          print("::notice title=Unit test summary::" + "%0A".join(lines))
          PY

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/test-results/testDebugUnitTest/*.xml

      - name: Upload Room schemas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: app/schemas/
          if-no-files-found: ignore

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cashflow-debug-apk
          path: app/build/outputs/apk/preview/app-preview.apk

      - name: Verify the APK (signing certificate, not debuggable, versionCode)
        run: |
          APK=app/build/outputs/apk/preview/app-preview.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --verbose --print-certs "$APK" 2>&1 | tee apksigner.txt || true
          CERT=$(sed -n 's/^.*Signer.*certificate SHA-256 digest: //p' apksigner.txt | head -1 | tr 'A-F' 'a-f')
          KS=$(keytool -list -keystore app/debug.keystore -storepass android 2>/dev/null | sed -n 's/^Certificate fingerprint (SHA-256): //p' | tr -d ':' | tr 'A-F' 'a-f')
          echo "APK signing certificate sha256: $CERT"
          echo "debug.keystore certificate sha256: $KS"
          BADGING=$("$BT/aapt2" dump badging "$APK")
          echo "$BADGING" | grep -E "^package:|application-debuggable|sdkVersion|targetSdkVersion" || true
          VC=$(echo "$BADGING" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -1)
          VN=$(echo "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -1)
          DEBUGGABLE=no
          if echo "$BADGING" | grep -q "application-debuggable"; then DEBUGGABLE=yes; fi
          echo "debuggable: $DEBUGGABLE"
          echo "::notice title=APK verification::cert=$CERT keystore=$KS debuggable=$DEBUGGABLE versionCode=$VC versionName=$VN"
          echo "::notice title=apksigner output::$(head -c 1500 apksigner.txt | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')"
          [ -n "$CERT" ] && [ "$CERT" = "$KS" ] || { echo "signing certificate does not match debug.keystore"; exit 1; }
          [ "$DEBUGGABLE" = "no" ] || { echo "APK is debuggable"; exit 1; }
          if [ "$GITHUB_REF" = "refs/heads/main" ] && [ "$VC" != "$GITHUB_RUN_NUMBER" ]; then
            echo "versionCode in APK ($VC) does not match GITHUB_RUN_NUMBER ($GITHUB_RUN_NUMBER)"; exit 1
          fi
          echo "VC=$VC" >> "$GITHUB_ENV"
          echo "VN=$VN" >> "$GITHUB_ENV"

      - name: Write version.json
        if: github.ref == 'refs/heads/main'
        run: |
          APK=app/build/outputs/apk/preview/app-preview.apk
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          cp "$APK" cashflow-debug.apk
          printf '{"versionCode": %s, "versionName": "%s", "sha256": "%s", "apkUrl": "https://github.com/Dragovitcmia-dot/MoneyPlan/releases/download/latest-debug/cashflow-debug.apk"}\n' "$VC" "$VN" "$SHA" > version.json
          cat version.json
          echo "::notice title=Release build::versionCode=$VC versionName=$VN sha256=$SHA"

      - name: Publish pre-release assets
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest-debug >/dev/null 2>&1 || \
            gh release create latest-debug --prerelease --target "$GITHUB_SHA" \
              --title "Latest debug build" --notes "Automated debug build from main."
          # APK first, then version.json, so a client never sees a version whose APK is missing.
          gh release upload latest-debug cashflow-debug.apk --clobber
          gh release upload latest-debug version.json --clobber

  emulator:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: cashflow-debug-apk
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Pillow and ffmpeg (screenshot / screen recording analysis)
        run: |
          python3 -m pip install --break-system-packages pillow numpy imageio-ffmpeg \
            || { sudo apt-get install -y python3-pil ffmpeg && python3 -m pip install --break-system-packages imageio-ffmpeg; }

      - name: Install the preview APK, launch it and walk through the app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_5
          disable-animations: true
          ram-size: 4096M
          heap-size: 576M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/ci-emulator.sh apk/app-preview.apk

      - name: Render the launcher icon (circle, squircle, themed, Lab; 48 / 96 / 192 px) and check the safe zone
        if: always()
        continue-on-error: true
        run: |
          mkdir -p screens
          python3 -m pip install --break-system-packages numpy >/dev/null 2>&1 || true
          python3 scripts/icon/vd_render.py screens/icon-preview.png

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-screens
          path: screens/*.png
          if-no-files-found: ignore

      - name: Publish screenshots to the ci-screens branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if ls screens/*.png >/dev/null 2>&1; then
            cd screens
            git init -q
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git checkout -q -b ci-screens
            git add -- *.png
            git commit -q -m "Screenshots for ${GITHUB_SHA} (${GITHUB_REF_NAME})"
            git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-screens
          else
            echo "no screenshots were produced"
          fi
